name: OGS-STAGED-CONSTRUCTION-R3J

on:
  push:
    branches: [agent/ogs-staged-construction-activation-a0]
    paths:
      - '.github/workflows/ogs-staged-construction-r3j.yml'
  pull_request:
    paths:
      - '.github/workflows/ogs-staged-construction-r3j.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a2-mfront-full-backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact canonical OGS upstream
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-upstream
          cd ogs-upstream
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"

      - name: Apply staged-construction implementation through A1
        run: |
          set -euxo pipefail
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h r3i a0 a1; do cp "scripts/ogs-staged-construction-${s}.py" ogs-upstream/; done
          cd ogs-upstream
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h r3i a0 a1; do python3 "ogs-staged-construction-${s}.py"; done
          grep -q 'initializeActivationPlacementState' ProcessLib/SmallDeformation/LocalAssemblerInterface.h
          grep -q 'newly_activated_element_ids' ProcessLib/SmallDeformation/SmallDeformationProcess.cpp
          git diff --check

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3

      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-${{ env.OGS_UPSTREAM_SHA }}-v1

      - name: Configure canonical OGS with MFront
        working-directory: ogs-upstream
        run: cmake --preset release -DOGS_BUILD_GUI=OFF -DOGS_BUILD_UTILS=OFF -DOGS_BUILD_TESTING=ON -DOGS_USE_MFRONT=ON '-DOGS_BUILD_PROCESSES=SmallDeformation'

      - name: Build ProcessLib SmallDeformation and ogs
        working-directory: ogs-upstream
        run: cmake --build --preset release --target ProcessLib SmallDeformation ogs --parallel 2

      - name: Generate full excavation-backfill MFront case
        working-directory: ogs-upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('Tests/Data/Mechanics/Excavation')
          dst = Path('staged-a2-case')
          shutil.copytree(src, dst, dirs_exist_ok=True)
          p = dst / 'time_linear_excavation.prj'
          text = p.read_text(encoding='latin-1')
          old = '''            <constitutive_relation id="0,1">
                <type>LinearElasticIsotropic</type>
                <youngs_modulus>E</youngs_modulus>
                <poissons_ratio>nu</poissons_ratio>
            </constitutive_relation>'''
          if old not in text:
              old = '''            <constitutive_relation id="0,1">
                          <type>LinearElasticIsotropic</type>
                          <youngs_modulus>E</youngs_modulus>
                          <poissons_ratio>nu</poissons_ratio>
                      </constitutive_relation>'''
          new = '''            <constitutive_relation id="0,1">
                <type>MFront</type>
                <behaviour>MohrCoulombAbboSloan</behaviour>
                <material_properties>
                    <material_property name="YoungModulus" parameter="E"/>
                    <material_property name="PoissonRatio" parameter="nu"/>
                    <material_property name="Cohesion" parameter="MC_Cohesion"/>
                    <material_property name="FrictionAngle" parameter="MC_FrictionAngle"/>
                    <material_property name="DilatancyAngle" parameter="MC_DilatancyAngle"/>
                    <material_property name="TransitionAngle" parameter="MC_TransitionAngle"/>
                    <material_property name="TensionCutOffParameter" parameter="MC_TensionCutOff"/>
                </material_properties>
            </constitutive_relation>'''
          if text.count(old) != 1:
              raise RuntimeError('expected one elastic constitutive relation')
          text = text.replace(old, new)
          marker = '            <specific_body_force>0 0</specific_body_force>'
          if text.count(marker) != 1:
              raise RuntimeError('unexpected process layout')
          text = text.replace(marker, marker + '\n            <reference_temperature>T_ref</reference_temperature>')
          params = '''        <parameter><name>T_ref</name><type>Constant</type><values>293.15</values></parameter>
        <parameter><name>MC_Cohesion</name><type>Constant</type><value>5e6</value></parameter>
        <parameter><name>MC_FrictionAngle</name><type>Constant</type><value>25</value></parameter>
        <parameter><name>MC_DilatancyAngle</name><type>Constant</type><value>10</value></parameter>
        <parameter><name>MC_TransitionAngle</name><type>Constant</type><value>27</value></parameter>
        <parameter><name>MC_TensionCutOff</name><type>Constant</type><value>1e6</value></parameter>
'''
          if text.count('    </parameters>') != 1:
              raise RuntimeError('unexpected parameters layout')
          text = text.replace('    </parameters>', params + '    </parameters>')
          if '<t_end>8</t_end>' not in text:
              raise RuntimeError('canonical backfill horizon missing')
          p.write_text(text, encoding='latin-1')
          PY

      - name: Run A2 full MFront excavation-backfill lifecycle
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          OGS_BIN="$(find "${GITHUB_WORKSPACE}/build/release" -type f -name ogs -perm -111 | head -n1)"
          test -n "$OGS_BIN"
          mkdir -p staged-a2-out
          set +e
          "$OGS_BIN" -o staged-a2-out staged-a2-case/time_linear_excavation.prj > staged-a2.log 2>&1
          rc=$?
          set -e
          cat staged-a2.log
          test "$rc" -eq 0
          grep -Eqi 'Simulation completed|OGS completed|simulation terminated successfully|OGS terminated successfully' staged-a2.log
          grep -q 'Staged construction transition completed for process' staged-a2.log
          ! grep -q 'MFront: integration failed' staged-a2.log

      - name: Verify A2 full-horizon evidence
        working-directory: ogs-upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('staged-a2.log').read_text(errors='replace')
          times = [float(m.group(1)) for m in re.finditer(r'Time:\s*([0-9.eE+-]+)', log)]
          if not times or max(times) < 8.0 - 1e-12:
              raise RuntimeError(f'full backfill horizon not reached: {max(times) if times else None}')
          if 'MFront: integration failed' in log:
              raise RuntimeError('MFront integration failure during backfill')
          Path('staged-a2-evidence.txt').write_text(
              f'max_time={max(times)}\nfull_backfill_horizon_reached=1\nmfront_integration_failure=0\n', encoding='utf-8')
          PY

      - name: Freeze A2 evidence
        if: always()
        run: |
          mkdir -p staged-construction-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=A2_full_mfront_backfill_e2e\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" > staged-construction-evidence/provenance.txt
          cp ogs-upstream/staged-a2.log staged-construction-evidence/ 2>/dev/null || true
          cp ogs-upstream/staged-a2-evidence.txt staged-construction-evidence/ 2>/dev/null || true
          cp ogs-upstream/staged-a2-case/time_linear_excavation.prj staged-construction-evidence/a2-mfront-backfill.prj 2>/dev/null || true

      - name: Upload A2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-a2-${{ github.sha }}
          path: staged-construction-evidence

      - name: Persist authoritative A2 verdict on activation branch
        if: always() && github.event_name == 'push'
        run: |
          set -euxo pipefail
          mkdir -p automation-evidence
          if test -f ogs-upstream/staged-a2-evidence.txt; then
            verdict=PASS
            cat ogs-upstream/staged-a2-evidence.txt > /tmp/a2-numerics.txt
          else
            verdict=FAIL
            printf 'full_backfill_horizon_reached=0\n' > /tmp/a2-numerics.txt
          fi
          {
            printf 'gate=A2_full_mfront_backfill_e2e\n'
            printf 'verdict=%s\n' "$verdict"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'upstream_sha=%s\n' "$OGS_UPSTREAM_SHA"
            cat /tmp/a2-numerics.txt
          } > automation-evidence/a2-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-evidence/a2-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist authoritative A2 backfill verdict'
            git push origin HEAD:agent/ogs-staged-construction-activation-a0
          fi
