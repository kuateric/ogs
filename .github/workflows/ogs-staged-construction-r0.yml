name: OGS-STAGED-CONSTRUCTION-R0

on:
  push:
    branches: [agent/ogs-staged-construction-r0]
    paths:
      - '.github/workflows/ogs-staged-construction-r0.yml'
      - 'scripts/ogs-staged-construction-r0.py'
      - 'scripts/ogs-staged-construction-r2b.py'
      - 'scripts/ogs-staged-construction-r2c.py'
  pull_request:
    paths:
      - '.github/workflows/ogs-staged-construction-r0.yml'
      - 'scripts/ogs-staged-construction-r0.py'
      - 'scripts/ogs-staged-construction-r2b.py'
      - 'scripts/ogs-staged-construction-r2c.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout implementation harness
        uses: actions/checkout@v4

      - name: Checkout exact canonical OGS upstream
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "${OGS_UPSTREAM_URL}" ogs-upstream
          cd ogs-upstream
          git fetch --depth=1 origin "${OGS_UPSTREAM_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${OGS_UPSTREAM_SHA}"

      - name: Apply staged-construction lifecycle integration
        run: |
          set -euxo pipefail
          cp scripts/ogs-staged-construction-r0.py ogs-upstream/
          cp scripts/ogs-staged-construction-r2b.py ogs-upstream/
          cp scripts/ogs-staged-construction-r2c.py ogs-upstream/
          cd ogs-upstream
          python3 ogs-staged-construction-r0.py
          python3 ogs-staged-construction-r2b.py
          python3 ogs-staged-construction-r2c.py
          test -f ProcessLib/StagedConstruction/DomainLifecycle.h
          test -f ProcessLib/StagedConstruction/MechanicalRemovalTransition.h
          test -f ProcessLib/StagedConstruction/MechanicalRemovalForceCapture.h
          test -f ProcessLib/StagedConstruction/MechanicalRemovalInterface.h
          grep -q 'StagedConstruction::determineDomainTransition' ProcessLib/ProcessVariable.cpp
          git diff --check
          git diff -- ProcessLib/CMakeLists.txt ProcessLib/StagedConstruction/DomainLifecycle.h ProcessLib/StagedConstruction/MechanicalRemovalTransition.h ProcessLib/StagedConstruction/MechanicalRemovalForceCapture.h ProcessLib/StagedConstruction/MechanicalRemovalInterface.h ProcessLib/ProcessVariable.cpp

      - name: Compile lifecycle and removal contracts smoke test
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cat > /tmp/test_staged_construction.cpp <<'CPP'
          #include "ProcessLib/StagedConstruction/DomainLifecycle.h"
          #include "ProcessLib/StagedConstruction/MechanicalRemovalTransition.h"
          #include "ProcessLib/StagedConstruction/MechanicalRemovalForceCapture.h"
          #include "ProcessLib/StagedConstruction/MechanicalRemovalInterface.h"
          #include <cassert>
          #include <cmath>
          #include <vector>

          int main()
          {
              using ProcessLib::StagedConstruction::MechanicalRemovalForceCapture;
              using ProcessLib::StagedConstruction::MechanicalRemovalTransition;
              using ProcessLib::StagedConstruction::determineDomainTransition;
              using ProcessLib::StagedConstruction::determineMechanicalRemovalInterfaceDOFs;

              std::vector<unsigned char> previous{1, 1, 0, 1};
              std::vector<unsigned char> current{1, 0, 1, 0};
              auto const t = determineDomainTransition(previous, current);
              assert((t.active_element_ids == std::vector<std::size_t>{0, 2}));
              assert((t.newly_activated_element_ids == std::vector<std::size_t>{2}));
              assert((t.newly_deactivated_element_ids == std::vector<std::size_t>{1, 3}));

              MechanicalRemovalTransition removal({4, 7}, {10.0, -6.0});
              auto const f0 = removal.forceAt(0.0);
              auto const fhalf = removal.forceAt(0.5);
              auto const f1 = removal.forceAt(1.0);
              assert(std::abs(f0[0] - 10.0) < 1e-15);
              assert(std::abs(f0[1] + 6.0) < 1e-15);
              assert(std::abs(fhalf[0] - 5.0) < 1e-15);
              assert(std::abs(fhalf[1] + 3.0) < 1e-15);
              assert(std::abs(f1[0]) < 1e-15 && std::abs(f1[1]) < 1e-15);

              MechanicalRemovalForceCapture capture({7, 4});
              capture.addElementResidual({1, 4, 7}, {100.0, 3.0, -2.0});
              capture.addElementResidual({4, 7, 9}, {5.0, -4.0, 200.0});
              auto const captured = capture.makeTransition();
              assert((captured.dofIDs() == std::vector<std::size_t>{4, 7}));
              assert(std::abs(captured.retainedForce()[0] - 8.0) < 1e-15);
              assert(std::abs(captured.retainedForce()[1] + 6.0) < 1e-15);
              auto const released = captured.forceAt(0.25);
              assert(std::abs(released[0] - 6.0) < 1e-15);
              assert(std::abs(released[1] + 4.5) < 1e-15);

              auto const interface_dofs = determineMechanicalRemovalInterfaceDOFs(
                  {{1, 4, 7}, {4, 7, 9}}, {{0, 4, 8}, {2, 7, 10}});
              assert((interface_dofs == std::vector<std::size_t>{4, 7}));
              return 0;
          }
          CPP
          c++ -std=c++17 -Wall -Wextra -Werror -I. /tmp/test_staged_construction.cpp -o /tmp/test_staged_construction
          /tmp/test_staged_construction

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3

      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-${{ env.OGS_UPSTREAM_SHA }}-v1

      - name: Configure canonical OGS
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --preset release \
            -DOGS_BUILD_GUI=OFF \
            -DOGS_BUILD_UTILS=OFF \
            -DOGS_BUILD_TESTING=ON \
            '-DOGS_BUILD_PROCESSES=SmallDeformation'

      - name: Build ProcessLib and SmallDeformation
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --build --preset release --target ProcessLib SmallDeformation --parallel 2

      - name: Freeze staged-construction evidence
        if: always()
        run: |
          mkdir -p staged-construction-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" > staged-construction-evidence/provenance.txt
          if [ -d ogs-upstream ]; then
            (cd ogs-upstream && git diff -- ProcessLib/CMakeLists.txt ProcessLib/StagedConstruction/DomainLifecycle.h ProcessLib/StagedConstruction/MechanicalRemovalTransition.h ProcessLib/StagedConstruction/MechanicalRemovalForceCapture.h ProcessLib/StagedConstruction/MechanicalRemovalInterface.h ProcessLib/ProcessVariable.cpp) > staged-construction-evidence/r2c.diff || true
          fi

      - name: Upload staged-construction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-r2c-${{ github.sha }}
          path: staged-construction-evidence
