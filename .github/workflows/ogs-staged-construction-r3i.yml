name: OGS-STAGED-CONSTRUCTION-R3I

on:
  push:
    branches: [agent/ogs-staged-construction-r0]
    paths:
      - '.github/workflows/ogs-staged-construction-r3i.yml'
      - 'scripts/ogs-staged-construction-r3i.py'
  pull_request:
    paths:
      - '.github/workflows/ogs-staged-construction-r3i.yml'
      - 'scripts/ogs-staged-construction-r3i.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-runtime-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact canonical OGS upstream
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-upstream
          cd ogs-upstream
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"

      - name: Apply R0 through R3I
        run: |
          set -euxo pipefail
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h r3i; do cp "scripts/ogs-staged-construction-${s}.py" ogs-upstream/; done
          cd ogs-upstream
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h r3i; do python3 "ogs-staged-construction-${s}.py"; done
          grep -q 'runPendingConstructionSubstepsOneProcess' ProcessLib/TimeLoop.cpp
          grep -q 'commitConstructionSubstepState' ProcessLib/TimeLoop.cpp
          grep -q 'rollbackConstructionSubstepTrial' ProcessLib/TimeLoop.cpp
          grep -q 'Adaptive staged-construction continuation is not yet enabled' ProcessLib/TimeLoop.cpp
          test "$(grep -c 'time_disc.nextTimestep(t, delta_t)' ProcessLib/TimeLoop.cpp)" -eq 1
          grep -q 'mgis::behaviour::update(_behaviour_data)' MaterialLib/SolidModels/MFront/MFrontGeneric.h
          git diff --check

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3

      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-${{ env.OGS_UPSTREAM_SHA }}-v1

      - name: Configure canonical OGS with MFront
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --preset release -DOGS_BUILD_GUI=OFF -DOGS_BUILD_UTILS=OFF -DOGS_BUILD_TESTING=ON -DOGS_USE_MFRONT=ON '-DOGS_BUILD_PROCESSES=SmallDeformation'

      - name: Build ProcessLib SmallDeformation and ogs
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --build --preset release --target ProcessLib SmallDeformation ogs --parallel 2

      - name: Run canonical elastic excavation with adaptive runtime continuation
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          OGS_BIN="$(find "${GITHUB_WORKSPACE}/build/release" -type f -name ogs -perm -111 | head -n1)"
          test -n "$OGS_BIN"
          mkdir -p staged-r3i-out
          "$OGS_BIN" -o staged-r3i-out Tests/Data/Mechanics/Excavation/time_linear_excavation.prj > staged-r3i.log 2>&1
          grep -Eqi 'Simulation completed|OGS completed|simulation terminated successfully|OGS terminated successfully|Time step.*accepted' staged-r3i.log
          grep -q 'Staged construction trial for process' staged-r3i.log
          grep -q 'Staged construction transition completed for process' staged-r3i.log

      - name: Freeze R3I evidence
        if: always()
        run: |
          mkdir -p staged-construction-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" > staged-construction-evidence/provenance.txt
          cp ogs-upstream/staged-r3i.log staged-construction-evidence/ 2>/dev/null || true
          (cd ogs-upstream && git diff -- ProcessLib/TimeLoop.cpp ProcessLib/Process.h ProcessLib/SmallDeformation ProcessLib/StagedConstruction) > staged-construction-evidence/r3i.diff || true

      - name: Upload R3I evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-r3i-${{ github.sha }}
          path: staged-construction-evidence
