name: OGS-STAGED-CONSTRUCTION-TRM-T6

on:
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-trm-t5.py'
      - 'scripts/ogs-staged-construction-trm-t5-f01.py'
      - 'scripts/run-ogs-staged-construction-trm-t6.sh'
      - '.github/workflows/ogs-staged-construction-trm-t6.yml'
  workflow_dispatch:

jobs:
  trm-t6-mfront-material-reassignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore portable dependency source cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: ogs-staged-construction-cpm-${{ runner.os }}-${{ runner.arch }}-adf770974c7ee0435702fe617634d03d17ab7cb8-mfront-v1
      - name: Apply T5-F01 shared MaterialID ownership fix
        run: python3 scripts/ogs-staged-construction-trm-t5-f01.py
      - name: Run TRM-T6 MFront/MGIS material reassignment E2E
        run: bash scripts/run-ogs-staged-construction-trm-t6.sh
      - name: Freeze TRM-T6 evidence
        if: always()
        run: |
          mkdir -p staged-construction-trm-t6-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=TRM_T6_MFront_material_reassignment\njob_status=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-trm-t6-evidence/provenance.txt
          cp trm-t6-evidence.txt staged-construction-trm-t6-evidence/ 2>/dev/null || true
          cp ogs-trm-t6/trm-t6.log staged-construction-trm-t6-evidence/ 2>/dev/null || true
          cp ogs-trm-t6/trm-t6-case/flow_fully_saturated.prj staged-construction-trm-t6-evidence/ 2>/dev/null || true
      - name: Upload TRM-T6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-trm-t6-${{ github.sha }}
          path: staged-construction-trm-t6-evidence
