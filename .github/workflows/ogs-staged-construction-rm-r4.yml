name: OGS-STAGED-CONSTRUCTION-RM-R4

on:
  pull_request:
    paths:
      - '.github/workflows/ogs-staged-construction-rm-r4.yml'
      - 'scripts/ogs-staged-construction-rm-r2b-fresh-birth-runtime.py'
      - 'scripts/ogs-staged-construction-rm-r4-material-reassignment.py'
  workflow_dispatch:

jobs:
  rm-r4-material-reassignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore portable dependency source cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: ogs-staged-construction-cpm-${{ runner.os }}-${{ runner.arch }}-adf770974c7ee0435702fe617634d03d17ab7cb8-v1
      - name: Checkout pinned canonical OGS
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-rm-r4
          cd ogs-rm-r4
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"
      - name: Apply passed RM fresh-birth implementation and R4 rebind
        run: |
          cp scripts/ogs-staged-construction-rm-r2b-fresh-birth-runtime.py /tmp/rm-r2b.py
          cp scripts/ogs-staged-construction-rm-r4-material-reassignment.py /tmp/rm-r4.py
          cd ogs-rm-r4
          python3 /tmp/rm-r2b.py
          python3 /tmp/rm-r4.py
          git diff --check
      - name: Configure and compile RM
        working-directory: ogs-rm-r4
        run: |
          cmake --preset release --fresh -DOGS_BUILD_GUI=OFF -DOGS_BUILD_UTILS=OFF -DOGS_BUILD_TESTING=ON '-DOGS_BUILD_PROCESSES=RichardsMechanics'
          cmake --build --preset release --target ProcessLib RichardsMechanics ogs --parallel 2
      - name: Prepare RM_A to void to RM_B construction case
        working-directory: ogs-rm-r4
        run: |
          cp -a Tests/Data/RichardsMechanics rm-r4-case
          python3 - <<'PY'
          from pathlib import Path
          from copy import deepcopy
          import xml.etree.ElementTree as ET

          p=Path('rm-r4-case/A2.prj')
          tree=ET.parse(p); root=tree.getroot()
          process=root.find('./processes/process')
          crs=process.findall('constitutive_relation')
          if len(crs)!=1 or (crs[0].get('id') or '').strip()!='0,1':
              raise RuntimeError('unexpected canonical A2 constitutive relation layout')

          # RM_A is the original material-1 behaviour (E=4 GPa). RM_B is a
          # genuinely different material-0 behaviour (E=2 GPa). Hydraulic
          # medium id=0,1 stays unchanged; R4 targets solid constitutive identity.
          cr_a=crs[0]
          cr_a.set('id','1')
          ym=cr_a.find('youngs_modulus')
          if ym is None or (ym.text or '').strip()!='E':
              raise RuntimeError('unexpected canonical A2 Young modulus parameter')
          cr_b=deepcopy(cr_a)
          cr_b.set('id','0')
          cr_b.find('youngs_modulus').text='E_B'
          idx=list(process).index(cr_a)
          process.insert(idx+1,cr_b)

          params=root.find('./parameters')
          ep=next((x for x in params.findall('parameter') if x.findtext('name')=='E'),None)
          if ep is None or float(ep.findtext('value'))!=4e9:
              raise RuntimeError('canonical A2 E changed')
          e_b=ET.Element('parameter')
          ET.SubElement(e_b,'name').text='E_B'
          ET.SubElement(e_b,'type').text='Constant'
          ET.SubElement(e_b,'value').text='2e9'
          params.append(e_b)

          variables={pv.findtext('name').strip():pv for pv in root.findall('./process_variables/process_variable')}
          for name in ('pressure','displacement'):
              pv=variables[name]
              ds=pv.find('deactivated_subdomains/deactivated_subdomain')
              if ds is None or (ds.findtext('material_ids') or '').strip()!='1':
                  raise RuntimeError(f'missing synchronized RM lifecycle for {name}')
              for tag in ('time_curve','line_segment','boundary_parameter'):
                  x=ds.find(tag)
                  if x is not None: ds.remove(x)
              ti=ET.Element('time_interval')
              ET.SubElement(ti,'start').text='2160'
              ET.SubElement(ti,'end').text='4320'
              ds.insert(0,ti)
              am=ET.Element('activation_material_id')
              am.text='0'
              # Keep target ID adjacent to the material-domain identity.
              mat=ds.find('material_ids')
              ds.insert(list(ds).index(mat)+1,am)

          # Preserve canonical physical loading and use the same convergent
          # four-step path that authoritatively closed R2/R3.
          load_top=next((x for x in params.findall('parameter') if x.findtext('name')=='load_top'),None)
          if load_top is None or float(load_top.findtext('values'))!=-12e6:
              raise RuntimeError('canonical A2 top load changed')
          ts=root.find('./time_loop/processes/process/time_stepping')
          for child in list(ts):
              if child.tag in {'t_end','timesteps'}: ts.remove(child)
          ET.SubElement(ts,'t_end').text='4334'
          steps=ET.SubElement(ts,'timesteps')
          for dt in ('0.01','2159.99','2160','14'):
              pair=ET.SubElement(steps,'pair')
              ET.SubElement(pair,'repeat').text='1'
              ET.SubElement(pair,'delta_t').text=dt
          tree.write(p,encoding='ISO-8859-1',xml_declaration=True)

          Path('../rm-r4-contract.txt').write_text(
              'RM_A_material_id=1\nRM_A_E=4e9\n'
              'void_interval_start=2160\nvoid_interval_end=4320\n'
              'RM_B_material_id=0\nRM_B_E=2e9\n'
              'hydraulic_medium_unchanged=true\n'
              'full_physical_operator=true\n'
              'material_homotopy=false\n')
          PY
      - name: Execute authoritative RM-R4 runtime
        working-directory: ogs-rm-r4
        run: |
          set -euo pipefail
          OGS_BIN="$(find "${GITHUB_WORKSPACE}/build/release" -type f -name ogs -perm -111 | head -n1)"
          test -n "$OGS_BIN"
          mkdir -p rm-r4-out
          "$OGS_BIN" -o rm-r4-out rm-r4-case/A2.prj > rm-r4.log 2>&1
          cat rm-r4.log
          grep -Eqi 'Simulation completed|OGS completed|simulation terminated successfully|OGS terminated successfully' rm-r4.log
          grep -Eq 'RM-R4 activation material reassigned.*old_material_id=1, new_material_id=0' rm-r4.log
          grep -Eq 'RM-R4 constitutive material rebound.*old_material_id=1, new_material_id=0' rm-r4.log
          grep -q 'RM fresh-birth state initialized' rm-r4.log
          grep -q 'RM birth reference captured' rm-r4.log
          ! grep -Eqi 'stiffness[_ -]?scale|residual[_ -]?homotopy|material[_ -]?homotopy' rm-r4.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('rm-r4.log').read_text(errors='replace')
          reb=re.search(r'RM-R4 constitutive material rebound for element (\d+): old_material_id=(\d+), new_material_id=(\d+)',log)
          if reb is None or tuple(map(int,reb.groups()[1:]))!=(1,0):
              raise RuntimeError('missing authoritative A->B constitutive rebind evidence')
          birth=re.search(r'RM fresh-birth event published.*?at t=([-+0-9.eE]+)',log)
          if birth is None or abs(float(birth.group(1))-4320.0)>1e-9:
              raise RuntimeError(f'unexpected material-B birth time: {birth.group(1) if birth else None}')
          summary=re.search(r'The whole computation of the time stepping took (\d+) steps, in which\s+the accepted steps are (\d+), and the rejected steps are (\d+)',log)
          if not summary:
              raise RuntimeError('missing physical time-step summary')
          total,accepted,rejected=map(int,summary.groups())
          if (total,accepted,rejected)!=(4,4,0):
              raise RuntimeError(f'unexpected R4 time stepping: {(total,accepted,rejected)}')
          Path('../rm-r4-evidence.txt').write_text(
              'upstream_sha=adf770974c7ee0435702fe617634d03d17ab7cb8\n'
              'gate=RM_R4_material_reassignment\n'
              f'element_id={reb.group(1)}\n'
              'old_material_id=1\nnew_material_id=0\n'
              'RM_A_E=4e9\nRM_B_E=2e9\n'
              'constitutive_rebind=true\nfresh_material_state=true\n'
              'stress_free_birth=true\nexplicit_p_L0=true\n'
              'full_physical_operator=true\n'
              'stiffness_scaling=false\nresidual_homotopy=false\nmaterial_homotopy=false\n'
              'physical_time_steps=4\nrejected_steps=0\nruntime_exit=0\n')
          PY
      - name: Freeze RM-R4 evidence
        if: always()
        run: |
          mkdir -p staged-construction-rm-r4-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=RM_R4_material_reassignment\njob_status=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-rm-r4-evidence/provenance.txt
          cp ogs-rm-r4/rm-r4.log staged-construction-rm-r4-evidence/ 2>/dev/null || true
          cp rm-r4-contract.txt rm-r4-evidence.txt staged-construction-rm-r4-evidence/ 2>/dev/null || true
          cd ogs-rm-r4 && git diff > ../staged-construction-rm-r4-evidence/r4.patch || true
      - name: Upload RM-R4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-rm-r4-${{ github.sha }}
          path: staged-construction-rm-r4-evidence
