name: OGS-STAGED-CONSTRUCTION-RM-R1

on:
  pull_request:
    paths:
      - 'scripts/run-ogs-staged-construction-rm-r1.sh'
      - '.github/workflows/ogs-staged-construction-rm-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogs-rm-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rm-r1-synchronized-runtime-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OGS_UPSTREAM_URL: https://github.com/ufz/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore canonical OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-${{ env.OGS_UPSTREAM_SHA }}-v1
      - name: Run RM-R1 synchronized pressure/displacement lifecycle E2E
        run: bash scripts/run-ogs-staged-construction-rm-r1.sh
      - name: Freeze RM-R1 evidence
        if: always()
        run: |
          mkdir -p staged-construction-rm-r1-evidence
          printf 'gate=RM-R1\nupstream_sha=%s\nworkflow_sha=%s\njob_status=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-rm-r1-evidence/provenance.txt
          cp rm-r1-evidence.txt staged-construction-rm-r1-evidence/ 2>/dev/null || true
          cp ogs-rm-r1/rm-r1.log staged-construction-rm-r1-evidence/ 2>/dev/null || true
          cp ogs-rm-r1/rm-r1-case/A2.prj staged-construction-rm-r1-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ogs-staged-construction-rm-r1-${{ github.sha }}
          path: staged-construction-rm-r1-evidence
          retention-days: 7
