name: OGS-STAGED-CONSTRUCTION-TRM-T1B

on:
  pull_request:
    paths:
      - 'scripts/run-ogs-staged-construction-trm-t1b.sh'
      - '.github/workflows/ogs-staged-construction-trm-t1b.yml'
  workflow_dispatch:

jobs:
  trm-t1b-synchronized-coupled-runtime-deactivation:
    runs-on: ubuntu-24.04
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-adf770974c7ee0435702fe617634d03d17ab7cb8-v1
      - name: Run TRM-T1B synchronized coupled runtime E2E
        run: bash scripts/run-ogs-staged-construction-trm-t1b.sh
      - name: Freeze TRM-T1B evidence
        if: always()
        run: |
          mkdir -p staged-construction-trm-t1b-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=TRM_T1B_synchronized_coupled_runtime_deactivation\njob_status=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-trm-t1b-evidence/provenance.txt
          cp trm-t1b-evidence.txt staged-construction-trm-t1b-evidence/ 2>/dev/null || true
          cp ogs-trm-t1b/trm-t1b.log staged-construction-trm-t1b-evidence/ 2>/dev/null || true
          cp ogs-trm-t1b/trm-t1b-case/flow_fully_saturated.prj staged-construction-trm-t1b-evidence/ 2>/dev/null || true
      - name: Upload TRM-T1B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-trm-t1b-${{ github.sha }}
          path: staged-construction-trm-t1b-evidence
