name: OGS-STAGED-CONSTRUCTION-HM-B4

on:
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-hm-b2.py'
      - 'scripts/ogs-staged-construction-hm-b3.py'
      - 'scripts/ogs-staged-construction-hm-b4.py'
      - 'scripts/run-ogs-staged-construction-hm-b4.sh'
      - '.github/workflows/ogs-staged-construction-hm-b4.yml'
  workflow_dispatch:

jobs:
  hm-b4-explicit-coupled-placement-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libeigen3-dev libboost-all-dev
      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            .cpm-cache
            build
          key: ogs-hm-b4-${{ runner.os }}-${{ hashFiles('scripts/run-ogs-staged-construction-hm-b4.sh', 'scripts/ogs-staged-construction-hm-b4.py') }}
          restore-keys: |
            ogs-hm-b4-${{ runner.os }}-
            ogs-hm-b3-${{ runner.os }}-
      - name: Run HM-B4 explicit coupled placement-state E2E
        run: bash scripts/run-ogs-staged-construction-hm-b4.sh
      - name: Freeze HM-B4 evidence
        if: always()
        run: |
          test -f hm-b4-evidence.txt && cat hm-b4-evidence.txt || true
      - name: Upload HM-B4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hm-b4-evidence
          path: |
            hm-b4-evidence.txt
            ogs-hm-b4/hm-b4.log
          if-no-files-found: warn
