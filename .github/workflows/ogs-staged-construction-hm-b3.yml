name: OGS-STAGED-CONSTRUCTION-HM-B3

on:
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-hm-b2.py'
      - 'scripts/ogs-staged-construction-hm-b3.py'
      - 'scripts/run-ogs-staged-construction-hm-b3.sh'
      - '.github/workflows/ogs-staged-construction-hm-b3.yml'
  workflow_dispatch:

jobs:
  hm-b3-fresh-coupled-birth-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libeigen3-dev libboost-all-dev
      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            .cpm-cache
            build
          key: ogs-hm-b3-${{ runner.os }}-${{ hashFiles('scripts/run-ogs-staged-construction-hm-b3.sh', 'scripts/ogs-staged-construction-hm-b3.py') }}
          restore-keys: |
            ogs-hm-b3-${{ runner.os }}-
            ogs-hm-b2-${{ runner.os }}-
      - name: Run HM-B3 fresh coupled birth-state E2E
        run: bash scripts/run-ogs-staged-construction-hm-b3.sh
      - name: Freeze HM-B3 evidence
        if: always()
        run: |
          test -f hm-b3-evidence.txt && cat hm-b3-evidence.txt || true
      - name: Upload HM-B3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hm-b3-evidence
          path: |
            hm-b3-evidence.txt
            ogs-hm-b3/hm-b3.log
          if-no-files-found: warn
