name: OGS-ACTPLAS-K0 launcher

on:
  pull_request:
    paths:
      - '.github/actplas-trigger'

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch ACTPLAS K0 on master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/actplas-k0.yml/dispatches" \
            -d '{"ref":"master"}'
          sleep 5
          python3 - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/actplas-k0.yml/runs?event=workflow_dispatch&per_page=5"
          req=urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as r:
              data=json.load(r)
          runs=data.get('workflow_runs', [])
          if not runs:
              raise SystemExit('No dispatched ACTPLAS run found')
          run=runs[0]
          print(f"ACTPLAS_RUN_ID={run['id']}")
          print(f"ACTPLAS_RUN_URL={run['html_url']}")
          print(f"ACTPLAS_STATUS={run['status']}")
          PY
