name: OGS-ACTPLAS-R04

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/actplas-r01.yml'
      - 'ci/actplas-r03.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sm-r04:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Install runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3 python3-pip

      - name: Restore ACTPLAS exact-ref runtime cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-actplas-runtime-ubuntu24-adf770974c7ee0435702fe617634d03d17ab7cb8-sm-hm-trm-mfront-v1

      - name: Run ACTPLAS R04
        run: bash ci/actplas-r03.sh

      - name: Upload ACTPLAS R04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-actplas-r04-evidence
          path: ogs-upstream/actplas-evidence/
          if-no-files-found: warn
