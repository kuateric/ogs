name: OGS-ACTPLAS-R17

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/actplas-r01.yml'
      - 'ci/actplas-r17.sh'
      - 'ci/actplas-r16.sh'
      - 'ci/actplas-r15.sh'
      - 'ci/actplas-r14.sh'
      - 'ci/actplas-r13.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sm-r17:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Install runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3 python3-pip

      - name: Restore ACTPLAS exact-ref runtime cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-actplas-runtime-ubuntu24-adf770974c7ee0435702fe617634d03d17ab7cb8-sm-hm-trm-mfront-v1

      - name: Run ACTPLAS R17
        run: bash ci/actplas-r17.sh

      - name: Upload ACTPLAS R17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-actplas-r17-evidence
          path: ogs-upstream/actplas-evidence/
          if-no-files-found: warn

      - name: Persist ACTPLAS run identity
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci
          cat > ci/actplas-latest.txt <<EOF
          workflow=OGS-ACTPLAS-R17
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          wrapper_sha=${GITHUB_SHA}
          ogs_upstream_sha=${OGS_UPSTREAM_SHA}
          job_status=${JOB_STATUS}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/actplas-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record ACTPLAS R17 run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
