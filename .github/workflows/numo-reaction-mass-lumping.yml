name: NUMO reaction mass lumping 6.5.8

on:
  push:
    branches:
      - agent/numo-reaction-mass-lumping-6.5.8
    paths:
      - scripts/numo_reaction_mass_lumping.py
      - .github/workflows/numo-reaction-mass-lumping.yml
  workflow_dispatch:

concurrency:
  group: numo-reaction-mass-lumping-6.5.8
  cancel-in-progress: true

permissions:
  contents: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build-and-reactive-transport-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout NUMO branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply reaction mass-lumping implementation
        run: |
          set -euxo pipefail
          python3 scripts/numo_reaction_mass_lumping.py
          git diff --check
          git diff -- ProcessLib/ComponentTransport/ComponentTransportFEM.h

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3

      - name: Restore OGS dependency cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: ogs-numo-6.5.8-cpm-v1

      - name: Configure focused OGS build
        run: |
          set -euxo pipefail
          cmake --preset release \
            -DOGS_BUILD_GUI=OFF \
            -DOGS_BUILD_UTILS=OFF \
            -DOGS_BUILD_TESTING=OFF \
            '-DOGS_BUILD_PROCESSES=ComponentTransport'

      - name: Build OGS ComponentTransport
        run: |
          set -euxo pipefail
          cmake --build --preset release --parallel 2 --target ogs
          OGS_BIN="$(find ../build/release ../build -type f -name ogs -perm -111 2>/dev/null | head -n1)"
          test -n "$OGS_BIN"
          echo "OGS_BIN=$(readlink -f "$OGS_BIN")" >> "$GITHUB_ENV"

      - name: Bundle corrected OGS runtime
        run: |
          set -euxo pipefail
          bundle="$RUNNER_TEMP/ogs-numo-runtime"
          rm -rf "$bundle"
          mkdir -p "$bundle/bin" "$bundle/lib"
          cp "$OGS_BIN" "$bundle/bin/ogs"

          # OGS shared libraries from the build tree.
          find ../build/release/lib -maxdepth 1 -type f -name '*.so*' -exec cp -L {} "$bundle/lib/" \; 2>/dev/null || true

          # Resolve the complete runtime dependency tree on the build host and
          # retain only non-system dependencies (CPM/VTK/HDF5/Python/etc.).
          LD_LIBRARY_PATH="$(dirname "$OGS_BIN"):$GITHUB_WORKSPACE/../build/release/lib:${LD_LIBRARY_PATH:-}" \
            ldd "$OGS_BIN" | tee "$RUNNER_TEMP/ogs-ldd.txt"
          awk '/=> \/.* \(0x/ {print $3} /^\// {print $1}' "$RUNNER_TEMP/ogs-ldd.txt" | sort -u > "$RUNNER_TEMP/ogs-deps.txt"
          while IFS= read -r dep; do
            test -f "$dep" || continue
            base="$(basename "$dep")"
            case "$dep:$base" in
              /home/runner/*:*|/opt/hostedtoolcache/*:*|*:*libpython3.12.so*)
                cp -L "$dep" "$bundle/lib/$base"
                ;;
            esac
          done < "$RUNNER_TEMP/ogs-deps.txt"

          tar -czf "$RUNNER_TEMP/ogs-numo-runtime.tar.gz" -C "$bundle" .
          echo "OGS_BUNDLE=$RUNNER_TEMP/ogs-numo-runtime.tar.gz" >> "$GITHUB_ENV"

      - name: Upload corrected OGS runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ogs-numo-runtime-bundle
          path: ${{ env.OGS_BUNDLE }}
          if-no-files-found: error
          retention-days: 3

      - name: Run official calcite PHREEQC benchmark
        run: |
          set -euxo pipefail
          case_dir="$GITHUB_WORKSPACE/Tests/Data/Parabolic/ComponentTransport/ReactiveTransport/EquilibriumPhase"
          out="$RUNNER_TEMP/numo-calcite"
          mkdir -p "$out"
          (cd "$case_dir" && "$OGS_BIN" -o "$out" calcite.prj) 2>&1 | tee "$RUNNER_TEMP/calcite.log"
          ! grep -Eqi '(^|[^a-z])nan([^a-z]|$)|negative concentration' "$RUNNER_TEMP/calcite.log"

      - name: Run official kinetic PHREEQC benchmark
        run: |
          set -euxo pipefail
          case_dir="$GITHUB_WORKSPACE/Tests/Data/Parabolic/ComponentTransport/ReactiveTransport/KineticReactant"
          out="$RUNNER_TEMP/numo-kinetic"
          mkdir -p "$out"
          (cd "$case_dir" && "$OGS_BIN" -o "$out" 1d_isofrac_small_domain.prj) 2>&1 | tee "$RUNNER_TEMP/kinetic.log"
          ! grep -Eqi '(^|[^a-z])nan([^a-z]|$)|negative concentration' "$RUNNER_TEMP/kinetic.log"

      - name: Commit tested implementation to branch
        run: |
          set -euxo pipefail
          if git diff --quiet -- ProcessLib/ComponentTransport/ComponentTransportFEM.h; then
            echo 'Source already contains tested patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProcessLib/ComponentTransport/ComponentTransportFEM.h
          git commit -m 'ComponentTransport: lump PHREEQC reaction mass matrix'
          git push origin HEAD:agent/numo-reaction-mass-lumping-6.5.8
