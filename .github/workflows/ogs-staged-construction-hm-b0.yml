name: OGS-STAGED-CONSTRUCTION-HM-B0

on:
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-hm-b0-contract.py'
      - '.github/workflows/ogs-staged-construction-hm-b0.yml'
      - 'automation-evidence/hm-b0-literature.md'
  workflow_dispatch:

jobs:
  hm-b0-coupled-lifecycle-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical authority pin
        shell: bash
        run: |
          grep -q 'adf770974c7ee0435702fe617634d03d17ab7cb8' automation-evidence/hm-b0-scope.txt
      - name: Run deterministic HM lifecycle contract
        run: python3 scripts/ogs-staged-construction-hm-b0-contract.py
      - name: Verify coupled operator scope
        shell: bash
        run: |
          grep -q 'mechanics' scripts/ogs-staged-construction-hm-b0-contract.py
          grep -q 'storage' scripts/ogs-staged-construction-hm-b0-contract.py
          grep -q 'darcy_flux' scripts/ogs-staged-construction-hm-b0-contract.py
          grep -q 'biot_coupling' scripts/ogs-staged-construction-hm-b0-contract.py
          grep -q 'physical_time_before == physical_time_after' scripts/ogs-staged-construction-hm-b0-contract.py
