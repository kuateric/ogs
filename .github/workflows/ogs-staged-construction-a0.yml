name: OGS-STAGED-CONSTRUCTION-A0

on:
  push:
    branches: [agent/ogs-staged-construction-activation-a0]
    paths:
      - 'scripts/ogs-staged-construction-a0.py'
      - '.github/workflows/ogs-staged-construction-a0.yml'
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-a0.py'
      - '.github/workflows/ogs-staged-construction-a0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-placement-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact canonical OGS upstream
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-upstream
          cd ogs-upstream
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"

      - name: Apply completed staged-construction baseline and A0
        run: |
          set -euxo pipefail
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h r3i a0; do cp "scripts/ogs-staged-construction-${s}.py" ogs-upstream/; done
          cd ogs-upstream
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h r3i a0; do python3 "ogs-staged-construction-${s}.py"; done
          git diff --check

      - name: Compile activation contract smoke test
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cat > /tmp/a0-smoke.cpp <<'CPP'
          #include "ProcessLib/StagedConstruction/ActivationPlacementState.h"
          #include <cassert>
          #include <vector>
          int main()
          {
              using namespace ProcessLib::StagedConstruction;
              std::vector<unsigned char> previous{1, 0, 0};
              std::vector<unsigned char> current{1, 1, 0};
              auto const transition = determineDomainTransition(previous, current);
              assert(transition.newly_activated_element_ids.size() == 1);
              assert(transition.newly_activated_element_ids[0] == 1);
              auto const placement = makeActivationPlacementState(transition);
              assert(placement.newlyActivatedElementIDs().size() == 1);
              assert(placement.constitutiveStatePolicy() ==
                     ActivationPlacementState::ConstitutiveStatePolicy::fresh_material_state);
              return 0;
          }
          CPP
          c++ -std=c++20 -I. /tmp/a0-smoke.cpp -o /tmp/a0-smoke
          /tmp/a0-smoke

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3

      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-${{ env.OGS_UPSTREAM_SHA }}-v1

      - name: Configure canonical OGS
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --preset release -DOGS_BUILD_GUI=OFF -DOGS_BUILD_UTILS=OFF -DOGS_BUILD_TESTING=ON '-DOGS_BUILD_PROCESSES=SmallDeformation'

      - name: Build ProcessLib and SmallDeformation
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --build --preset release --target ProcessLib SmallDeformation --parallel 2

      - name: Freeze A0 evidence
        if: always()
        run: |
          mkdir -p staged-construction-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=A0_activation_placement_contract\nconstitutive_state_policy=fresh_material_state\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" > staged-construction-evidence/provenance.txt
          (cd ogs-upstream && git diff -- ProcessLib/StagedConstruction) > staged-construction-evidence/a0.diff || true

      - name: Upload A0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-a0-${{ github.sha }}
          path: staged-construction-evidence
