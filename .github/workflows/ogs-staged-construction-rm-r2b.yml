name: OGS-STAGED-CONSTRUCTION-RM-R2B

on:
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-rm-r2b-fresh-birth-runtime.py'
      - '.github/workflows/ogs-staged-construction-rm-r2b.yml'
  workflow_dispatch:

jobs:
  rm-r2b-fresh-birth-runtime:
    runs-on: ubuntu-24.04
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore portable dependency source cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: ogs-staged-construction-cpm-${{ runner.os }}-${{ runner.arch }}-adf770974c7ee0435702fe617634d03d17ab7cb8-v1
      - name: Checkout pinned canonical OGS
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-rm-r2b
          cd ogs-rm-r2b
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"
      - name: Apply RM fresh-birth runtime implementation
        run: |
          cp scripts/ogs-staged-construction-rm-r2b-fresh-birth-runtime.py /tmp/rm-r2b.py
          cd ogs-rm-r2b
          python3 /tmp/rm-r2b.py
          git diff --check
          git diff -- ProcessLib/RichardsMechanics/LocalAssemblerInterface.h ProcessLib/RichardsMechanics/RichardsMechanicsFEM.h ProcessLib/RichardsMechanics/RichardsMechanicsFEM-impl.h ProcessLib/RichardsMechanics/RichardsMechanicsProcess.h ProcessLib/RichardsMechanics/RichardsMechanicsProcess.cpp
      - name: Configure RM build
        working-directory: ogs-rm-r2b
        run: cmake --preset release --fresh -DOGS_BUILD_GUI=OFF -DOGS_BUILD_UTILS=OFF -DOGS_BUILD_TESTING=ON '-DOGS_BUILD_PROCESSES=RichardsMechanics'
      - name: Compile RM implementation
        working-directory: ogs-rm-r2b
        run: cmake --build --preset release --target ProcessLib RichardsMechanics ogs --parallel 2
      - name: Prepare reversible RM birth case
        working-directory: ogs-rm-r2b
        run: |
          cp -a Tests/Data/RichardsMechanics rm-r2b-case
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('rm-r2b-case/A2.prj')
          tree = ET.parse(p)
          root = tree.getroot()
          variables = {pv.findtext('name').strip(): pv for pv in root.findall('./process_variables/process_variable')}
          for name in ('pressure','displacement'):
              pv = variables[name]
              ds = pv.find('deactivated_subdomains/deactivated_subdomain')
              if ds is None or (ds.findtext('material_ids') or '').strip() != '1':
                  raise RuntimeError(f'missing synchronized MaterialID=1 RM lifecycle for {name}')
              for tag in ('time_curve','line_segment','boundary_parameter'):
                  x = ds.find(tag)
                  if x is not None: ds.remove(x)
              ti = ET.Element('time_interval')
              ET.SubElement(ti,'start').text='2160'
              ET.SubElement(ti,'end').text='4320'
              ds.insert(0,ti)

          # Do not perturb the canonical A2 initial equilibrium. In the failed
          # harness the artificial p_L=-25 kPa/zero-stress state failed already
          # at t=0.01, before any activation event. Here p_L0 is explicit by
          # capture of the last converged pressure at reactivation, while all
          # canonical physical parameters and the full RM operator stay intact.
          ts=root.find('./time_loop/processes/process/time_stepping')
          if ts is None:
              raise RuntimeError('missing RM time stepping')
          for child in list(ts):
              if child.tag in {'t_end','timesteps'}: ts.remove(child)
          ET.SubElement(ts,'t_end').text='4334'
          steps=ET.SubElement(ts,'timesteps')
          for dt in ('0.01','2159.99','2160','14'):
              pair=ET.SubElement(steps,'pair')
              ET.SubElement(pair,'repeat').text='1'
              ET.SubElement(pair,'delta_t').text=dt
          tree.write(p, encoding='ISO-8859-1', xml_declaration=True)
          PY
      - name: Execute RM-R2B authoritative runtime
        working-directory: ogs-rm-r2b
        run: |
          set -euo pipefail
          OGS_BIN="$(find "${GITHUB_WORKSPACE}/build/release" -type f -name ogs -perm -111 | head -n1)"
          test -n "$OGS_BIN"
          mkdir -p rm-r2b-out
          set +e
          "$OGS_BIN" -o rm-r2b-out rm-r2b-case/A2.prj > rm-r2b.log 2>&1
          rc=$?
          set -e
          cat rm-r2b.log
          test "$rc" -eq 0
          grep -Eqi 'Simulation completed|OGS completed|simulation terminated successfully|OGS terminated successfully' rm-r2b.log
          grep -q 'RM fresh-birth event published' rm-r2b.log
          grep -q 'RM fresh-birth state initialized' rm-r2b.log
          grep -q 'RM birth reference captured' rm-r2b.log
          ! grep -Eqi 'stiffness[_ -]?scale|residual[_ -]?homotopy|material[_ -]?homotopy' rm-r2b.log
      - name: Freeze RM-R2B evidence
        if: always()
        run: |
          mkdir -p staged-construction-rm-r2b-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=RM_R2B_fresh_birth_runtime\njob_status=%s\npolicy=u_birth:last_converged,p_L0:last_converged_explicit,stress_birth:zero,operator:full\ncanonical_a2_physics=unchanged\ncanonical_time_increments=0.01,2159.99,2160,14\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-rm-r2b-evidence/provenance.txt
          cp ogs-rm-r2b/rm-r2b.log staged-construction-rm-r2b-evidence/ 2>/dev/null || true
          cd ogs-rm-r2b && git diff > ../staged-construction-rm-r2b-evidence/r2b.patch || true
      - name: Upload RM-R2B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-rm-r2b-${{ github.sha }}
          path: staged-construction-rm-r2b-evidence
