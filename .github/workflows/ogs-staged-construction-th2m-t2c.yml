name: OGS-STAGED-CONSTRUCTION-TH2M-T2C

on:
  pull_request:
    paths:
      - 'scripts/run-ogs-staged-construction-th2m-t2c.sh'
      - 'scripts/run-ogs-staged-construction-th2m-t1b.sh'
      - 'scripts/ogs-staged-construction-th2m-t2b-fresh-birth-runtime.py'
      - '.github/workflows/ogs-staged-construction-th2m-t2c.yml'
  workflow_dispatch:

jobs:
  th2m-t2c-fresh-birth-runtime:
    runs-on: ubuntu-24.04
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore portable dependency source cache
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: ogs-staged-construction-cpm-${{ runner.os }}-${{ runner.arch }}-adf770974c7ee0435702fe617634d03d17ab7cb8-v1
      - name: Execute TH2M fresh-birth runtime E2E
        shell: bash
        run: bash scripts/run-ogs-staged-construction-th2m-t2c.sh
      - name: Freeze TH2M-T2C evidence
        if: always()
        run: |
          mkdir -p staged-construction-th2m-t2c-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=TH2M_T2C_fresh_birth_runtime\njob_status=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-th2m-t2c-evidence/provenance.txt
          test ! -f th2m-t2c-evidence.txt || cp th2m-t2c-evidence.txt staged-construction-th2m-t2c-evidence/
          test ! -f ogs-th2m-t2c/th2m-t2c.log || cp ogs-th2m-t2c/th2m-t2c.log staged-construction-th2m-t2c-evidence/runtime.log
      - name: Upload TH2M-T2C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-th2m-t2c-${{ github.sha }}
          path: staged-construction-th2m-t2c-evidence
