name: OGS-STAGED-CONSTRUCTION-HM-B2

on:
  pull_request:
    paths:
      - 'scripts/ogs-staged-construction-hm-b2.py'
      - 'scripts/run-ogs-staged-construction-hm-b2.sh'
      - '.github/workflows/ogs-staged-construction-hm-b2.yml'
  workflow_dispatch:

jobs:
  hm-b2-process-wide-coupled-active-domain:
    runs-on: ubuntu-24.04
    env:
      OGS_UPSTREAM_URL: https://github.com/Helmholtz-UFZ/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3
      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-adf770974c7ee0435702fe617634d03d17ab7cb8-v1
      - name: Run HM-B2 coupled active-domain E2E
        run: bash scripts/run-ogs-staged-construction-hm-b2.sh
      - name: Freeze HM-B2 evidence
        if: always()
        run: |
          mkdir -p staged-construction-hm-b2-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\ngate=HM_B2_process_wide_coupled_active_domain\njob_status=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" "${{ job.status }}" > staged-construction-hm-b2-evidence/provenance.txt
          cp hm-b2-evidence.txt staged-construction-hm-b2-evidence/ 2>/dev/null || true
          cp ogs-hm-b2/hm-b2.log staged-construction-hm-b2-evidence/ 2>/dev/null || true
          cp ogs-hm-b2/hm-b2-case/simHM_deactivate_H.prj staged-construction-hm-b2-evidence/ 2>/dev/null || true
      - name: Upload HM-B2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-hm-b2-${{ github.sha }}
          path: staged-construction-hm-b2-evidence
