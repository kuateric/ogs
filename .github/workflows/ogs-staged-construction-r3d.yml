name: OGS-STAGED-CONSTRUCTION-R3D

on:
  push:
    branches: [agent/ogs-staged-construction-r0]
    paths:
      - '.github/workflows/ogs-staged-construction-r3d.yml'
      - 'scripts/ogs-staged-construction-r3d.py'
  pull_request:
    paths:
      - '.github/workflows/ogs-staged-construction-r3d.yml'
      - 'scripts/ogs-staged-construction-r3d.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-transaction-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
      OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact canonical OGS upstream
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-upstream
          cd ogs-upstream
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"

      - name: Apply R0 through R3D
        run: |
          set -euxo pipefail
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d; do cp "scripts/ogs-staged-construction-${s}.py" ogs-upstream/; done
          cd ogs-upstream
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d; do python3 "ogs-staged-construction-${s}.py"; done
          grep -q 'hasPendingConstructionSubsteps' ProcessLib/Process.h
          grep -q 'beginConstructionSubstepTrial' ProcessLib/Process.h
          grep -q 'AdaptiveRemovalTransaction' ProcessLib/SmallDeformation/SmallDeformationProcess.h
          grep -q 'staged_construction_removal_transaction_' ProcessLib/SmallDeformation/SmallDeformationProcess.cpp
          git diff --check

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git python3

      - name: Restore OGS build cache
        uses: actions/cache@v4
        with:
          path: |
            build/release
            .cpm-cache
          key: ogs-staged-construction-r0-${{ runner.os }}-${{ env.OGS_UPSTREAM_SHA }}-v1

      - name: Configure canonical OGS
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --preset release -DOGS_BUILD_GUI=OFF -DOGS_BUILD_UTILS=OFF -DOGS_BUILD_TESTING=ON '-DOGS_BUILD_PROCESSES=SmallDeformation'

      - name: Build ProcessLib SmallDeformation and ogs
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          cmake --build --preset release --target ProcessLib SmallDeformation ogs --parallel 2

      - name: Run canonical elastic excavation regression
        working-directory: ogs-upstream
        run: |
          set -euxo pipefail
          OGS_BIN="$(find "${GITHUB_WORKSPACE}/build/release" -type f -name ogs -perm -111 | head -n1)"
          test -n "$OGS_BIN"
          mkdir -p staged-r3d-out
          "$OGS_BIN" -o staged-r3d-out Tests/Data/Mechanics/Excavation/time_linear_excavation.prj > staged-r3d.log 2>&1
          grep -Eqi 'Simulation completed|OGS completed|simulation terminated successfully|OGS terminated successfully|Time step.*accepted' staged-r3d.log

      - name: Freeze R3D evidence
        if: always()
        run: |
          mkdir -p staged-construction-evidence
          printf 'upstream_sha=%s\nworkflow_sha=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" > staged-construction-evidence/provenance.txt
          cp ogs-upstream/staged-r3d.log staged-construction-evidence/ 2>/dev/null || true
          (cd ogs-upstream && git diff -- ProcessLib/Process.h ProcessLib/SmallDeformation/SmallDeformationProcess.h ProcessLib/SmallDeformation/SmallDeformationProcess.cpp ProcessLib/StagedConstruction) > staged-construction-evidence/r3d.diff || true

      - name: Upload R3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-r3d-${{ github.sha }}
          path: staged-construction-evidence
