name: OGS-ACTPLAS Status Publisher

on:
  workflow_run:
    workflows: ["OGS-ACTPLAS-K0"]
    types: [completed]

permissions:
  contents: write

env:
  CANONICAL_OGS_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8

jobs:
  publish-status:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Freeze latest ACTPLAS run locator
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euxo pipefail
          mkdir -p actplas-status
          cat > actplas-status/latest.txt <<EOF
          workflow=OGS-ACTPLAS-K0
          run_id=${RUN_ID}
          run_number=${RUN_NUMBER}
          run_attempt=${RUN_ATTEMPT}
          status=${RUN_STATUS}
          conclusion=${RUN_CONCLUSION}
          wrapper_head_sha=${RUN_HEAD_SHA}
          canonical_ogs_sha=${CANONICAL_OGS_SHA}
          url=${RUN_URL}
          EOF

      - name: Commit status locator
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add actplas-status/latest.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record latest ACTPLAS run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
