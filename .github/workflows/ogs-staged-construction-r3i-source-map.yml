name: OGS-STAGED-CONSTRUCTION-R3I-SOURCE-MAP

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  OGS_UPSTREAM_URL: https://gitlab.opengeosys.org/ogs/ogs.git
  OGS_UPSTREAM_SHA: adf770974c7ee0435702fe617634d03d17ab7cb8

jobs:
  exact-runtime-source-map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact canonical OGS upstream
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$OGS_UPSTREAM_URL" ogs-upstream
          cd ogs-upstream
          git fetch --depth=1 origin "$OGS_UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OGS_UPSTREAM_SHA"

      - name: Apply staged-construction implementation through R3H
        shell: bash
        run: |
          set -euxo pipefail
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h; do
            cp "scripts/ogs-staged-construction-${s}.py" ogs-upstream/
          done
          cd ogs-upstream
          for s in r0 r2b r2c r2d r2e r2f r2g r2h r2i r2j r2k r2k-f01 r2l r3a r3b r3c r3d r3e r3f r3g r3h; do
            python3 "ogs-staged-construction-${s}.py"
          done
          git diff --check

      - name: Freeze exact runtime integration source map
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p staged-construction-r3i-source-map
          cp ogs-upstream/ProcessLib/TimeLoop.cpp staged-construction-r3i-source-map/TimeLoop.cpp
          cp ogs-upstream/ProcessLib/TimeLoop.h staged-construction-r3i-source-map/TimeLoop.h
          cp ogs-upstream/ProcessLib/Process.h staged-construction-r3i-source-map/Process.h
          cp ogs-upstream/ProcessLib/StagedConstruction/ConstructionTimeLoopDriver.h staged-construction-r3i-source-map/ConstructionTimeLoopDriver.h
          cp ogs-upstream/ProcessLib/StagedConstruction/ConstructionSubstepDriver.h staged-construction-r3i-source-map/ConstructionSubstepDriver.h
          printf 'upstream_sha=%s\nworkflow_sha=%s\n' "$OGS_UPSTREAM_SHA" "$GITHUB_SHA" > staged-construction-r3i-source-map/provenance.txt
          grep -n -E 'solveOneTimeStepOneProcess|solveOneConstructionSubstepOneProcess|preTimestep|postTimestep|hasPendingConstructionSubsteps|process_data' ogs-upstream/ProcessLib/TimeLoop.cpp > staged-construction-r3i-source-map/anchors.txt

      - name: Upload R3I source map
        uses: actions/upload-artifact@v4
        with:
          name: ogs-staged-construction-r3i-source-map-${{ github.sha }}
          path: staged-construction-r3i-source-map
